<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X Enhancement Suite settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header>
        <img src="../../assets/icon-128.png" alt="" width="64" height="64">
        <div>
          <p class="eyebrow">X Enhancement Suite</p>
          <h1>Custom CSS</h1>
          <p class="intro">
            Add personal styles that run only on X while enhancements are enabled.
          </p>
        </div>
      </header>

      <section class="panel">
        <label for="custom-css">CSS rules</label>
        <p class="hint">
          Use X's accessibility attributes and <code>data-testid</code> selectors
          when possible. Generated class names are likely to change.
        </p>
        <textarea id="custom-css" maxlength="7000" spellcheck="false" placeholder="/* Example: make the main timeline wider */
[data-testid=&quot;primaryColumn&quot;] {
  max-width: 720px !important;
}"></textarea>

        <div class="actions">
          <button id="save" class="primary" type="button">Save CSS</button>
          <button id="reset" class="secondary" type="button">Reset all settings</button>
          <p id="status" role="status" aria-live="polite"></p>
        </div>
      </section>

      <aside>
        Custom CSS is stored in Chrome Sync and applied immediately to open X tabs.
      </aside>
    </main>

    <script src="../shared/settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
